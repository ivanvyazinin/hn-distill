name: hourly-build

on:
  schedule:
    # Every 3 hours at :17 UTC (00:17, 03:17, 06:17, ...). NOT on the hour: GitHub
    # deprioritises schedules on round minutes, and the 00:00 slot was silently
    # dropped 5 times in 4 days (gaps of 4.5-5.6h instead of 3h, 2026-07-28..08-01).
    - cron: "17 */3 * * *"
  workflow_dispatch:

concurrency:
  group: hn-distill-hourly
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Show Node.js version
        run: node --version

      - name: Setup Bun and Install Dependencies
        uses: ./.github/actions/setup-bun

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Restore state from VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          mkdir -p data
          rsync -az "$VPS_USER@$VPS_HOST:$VPS_PATH/" data/
          # Cold start may have no backup yet (missing file is fine). An existing
          # file must be a real SQLite DB, not a truncated placeholder
          # (1-byte backup incident, 2026-08).
          if [ -e data/hn.sqlite ]; then
            bytes=$(wc -c < data/hn.sqlite)
            if [ "$bytes" -lt 4096 ] || ! head -c 16 data/hn.sqlite | grep -aq '^SQLite format 3'; then
              echo "::error::restored data/hn.sqlite is corrupt (${bytes} bytes); refusing to run on it"
              exit 1
            fi
          fi

      - name: Run data pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Optional: higher Jina Reader RPM for Cloudflare-blocked article origins.
          # Fallback works without a key; unset secret is fine.
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          ARTICLE_FETCH_READER_FALLBACK: ${{ vars.ARTICLE_FETCH_READER_FALLBACK || 'true' }}
          TOP_N: ${{ vars.TOP_N || '40' }}
          SUMMARIZE_MIN_SCORE: ${{ vars.SUMMARIZE_MIN_SCORE || '300' }}
          SUMMARIZE_MIN_COMMENTS: ${{ vars.SUMMARIZE_MIN_COMMENTS || '100' }}
          SUMMARY_LANG: ${{ vars.SUMMARY_LANG || 'ru' }}
          AGGREGATE_FROM_DB: ${{ vars.AGGREGATE_FROM_DB || 'true' }}
          LLM_USAGE_ENABLED: ${{ vars.LLM_USAGE_ENABLED || 'false' }}
          # Phase 4 limited Qwen 27b secondary hop (defaults OFF / share 0).
          # Rollout stages and live values: repo vars + docs/runbook-comments-qwen27b-rollout.md.
          COMMENTS_QWEN27B_ROUTE_ENABLE: ${{ vars.COMMENTS_QWEN27B_ROUTE_ENABLE || 'false' }}
          COMMENTS_QWEN27B_ROUTE_SHARE: ${{ vars.COMMENTS_QWEN27B_ROUTE_SHARE || '0' }}
          # All model IDs (OPENROUTER_*, COMMENTS_*, TAGS_*, POST_GUARD_*,
          # SUMMARY_CONTENT_REJECT_MODEL) come only from config/env.ts defaults.
          # Do not reintroduce workflow model env or repository model variables.
        run: |
          set -o pipefail
          make run 2>&1 | tee /tmp/pipeline.log

      - name: Fail loudly if the OpenRouter key budget tripped
        # Project policy: routing must be free; paid spend means something is
        # broken. The per-key spend cap is the deliberate canary — when it trips,
        # ALL OpenRouter calls die (including :free), so fail instead of shipping
        # a silently degraded run. Backup/deploy stay skipped until it is fixed.
        run: |
          if grep -q 'Key limit exceeded' /tmp/pipeline.log; then
            echo "::error::OpenRouter key hit its spend limit — free-first routing died mid-run (403 Key limit exceeded). Fix the key at openrouter.ai/settings/keys, then re-run."
            exit 1
          fi

      - name: Backup state to VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          if [ ! -f data/hn.sqlite ]; then
            echo "::error::pipeline produced no data/hn.sqlite; refusing to skip backup silently"
            exit 1
          fi
          bytes=$(wc -c < data/hn.sqlite)
          if [ "$bytes" -lt 4096 ] || ! head -c 16 data/hn.sqlite | grep -aq '^SQLite format 3'; then
            echo "::error::data/hn.sqlite is invalid (${bytes} bytes); refusing to overwrite the VPS backup with garbage"
            exit 1
          fi
          rsync -az --delete --exclude 'bench/' --exclude '.DS_Store' --exclude '*.sqlite-shm' --exclude '*.sqlite-wal' data/ "$VPS_USER@$VPS_HOST:$VPS_PATH/"

      - name: Build site
        env:
          SITE: ${{ vars.SITE }}
          BASE: ${{ vars.BASE || '/' }}
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          # Same publish bar as aggregate: loadAggregated filters by these.
          SUMMARIZE_MIN_SCORE: ${{ vars.SUMMARIZE_MIN_SCORE || '300' }}
          SUMMARIZE_MIN_COMMENTS: ${{ vars.SUMMARIZE_MIN_COMMENTS || '100' }}
        run: make build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment: github-pages
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
